<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIA Project Version Manager</title>

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/modals.css" />
  <script>
    (function() {
      const savedTheme = localStorage.getItem('tia-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body>
  <div id="app">

    <!-- Custom title bar -->
    <div id="titlebar">
      <span class="app-title">TIA Project Version Manager</span>
      <div class="window-controls">
        <button class="wc-btn" id="btn-minimize" title="Minimize">&#8211;</button>
        <button class="wc-btn" id="btn-maximize" title="Maximize">&#9633;</button>
        <button class="wc-btn close" id="btn-close" title="Close">&#10005;</button>
      </div>
    </div>

    <!-- Progress bar (global, thin line) -->
    <div id="progress-bar-wrap" class="hidden">
      <div id="progress-bar-fill"></div>
    </div>

    <!-- Main workspace -->
    <div id="workspace">

      <!-- Sidebar -->
      <nav id="sidebar">
        <!-- Populated by sidebar.js -->
      </nav>

      <!-- Main panel -->
      <main id="main-panel">
        <div id="main-toolbar">
          <!-- Populated by toolbar.js -->
        </div>
        <div id="version-list-container">
          <!-- Populated by version-list.js -->
        </div>
      </main>

    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
